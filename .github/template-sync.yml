# Files copied from this template into repositories created from it.
# Nested templates (for example plugin-template) keep extra keys/files;
# after their sync PR is merged they fan out to their own generated repos.

discover: true
skip_archived: true
prefer_branch: dev

# Extra downstream repos that GitHub does not mark as generated from this template.
include_repos:
# Repos to skip even if they were generated from this template.
exclude_repos:

identity:
  extra:
    re.neotamia.kotlintemplate: re.{owner_slug}.{slug}
    neotamia-build: "{slug}-build"
  owner_files:
    - README.md
    - CONTRIBUTING.md
    - settings.gradle.kts
    - buildSrc/src/main/kotlin/*-build.gradle.kts

# Identical infrastructure: rewritten with the dest project identity, then copied.
overwrite:
  - .editorconfig
  - .github/renovate.json5
  - .github/workflows/build.yml
  - .github/workflows/lint.yml
  - .github/workflows/test.yml
  - .github/workflows/release-please.yml
  - .github/workflows/template-sync.yml
  - .github/ISSUE_TEMPLATE/**
  - .github/PULL_REQUEST_TEMPLATE.md
  - gradle/wrapper/**
  - buildSrc/build.gradle.kts
  - buildSrc/settings.gradle.kts
  - settings.gradle.kts
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md

# Version catalog: template versions/libraries win, dest-only keys are kept.
merge_toml:
  - gradle/libs.versions.toml

# Customized files: apply the template delta since the last sync.
three_way:
  - buildSrc/src/main/kotlin/*-build.gradle.kts
  - gradle.properties
  - AGENTS.md
  - .github/template-sync.yml

exclude:
  - .github/workflows/project-setup.yml
  - .github/template-sync-state.json
  - modules/**
  - README.md
